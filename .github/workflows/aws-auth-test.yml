name: Test AWS authentication

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  authenticate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Show OIDC identity claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(`Subject: ${claims.sub}`);
            core.info(`Audience: ${claims.aud}`);
            core.info(`Issuer: ${claims.iss}`);
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::652546415579:role/olist-github-terraform
          aws-region: eu-west-2
          retry-max-attempts: 2

      - name: Show AWS identity
        run: aws sts get-caller-identity